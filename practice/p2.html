<!DOCTYPE html>
<html>
<body>
<form>
<input type="text" placeholder="Enter Number">
<button type = "submit">Submit</button>
</form>

<script>
let form = document.querySelector("form")
form.addEventListener("submit",function(e){
    e.preventDefault();
    let num = document.querySelector("input").value
    if(num.length!=10){
        alert("Must be 10")
        return;
    }
})


</script>

</body>
</html>
